name: Release ROS 2 Multi-Arch Debian Packages

on:
  push:
    tags:
      - 'v*'
      - 'beta*'
    branches:
      - jazzy-devel
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0 or latest)'
        required: false
        default: 'latest'

permissions:
  contents: write

jobs:
  version:
    name: Resolve Release Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      clean_version: ${{ steps.vars.outputs.clean_version }}
    steps: 
      - name: Checkout (tags give the next version for dev builds)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute Clean Version 
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag_name }}" ]]; then
            RAW_VERSION="${{ inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_VERSION="${GITHUB_REF#refs/tags/}"
          else
            RAW_VERSION="${GITHUB_REF_NAME}"
          fi

          NUM="" REST=""
          if [[ "${RAW_VERSION}" =~ ^[^0-9]*([0-9]+(\.[0-9]+)*)(.*)$ && "${RAW_VERSION}" != latest ]]; then
            NUM="${BASH_REMATCH[1]}" REST="${BASH_REMATCH[3]}"
          fi
          if [[ -n "${NUM}" && "${RAW_VERSION}" == *beta* ]]; then
            B=""; [[ "${REST}" =~ ([0-9]+)$ ]] && B="${BASH_REMATCH[1]}"
            CLEAN_VERSION="${NUM}~beta${B}-1"
          elif [[ -n "${NUM}" && -z "${REST}" ]]; then
            CLEAN_VERSION="${NUM}-1"
          else
            LAST=$(git -c safe.directory='*' tag -l | grep -vi beta | sed -nE 's/^v?([0-9]+(\.[0-9]+)+)$/\1/p' | sort -V | tail -n1)
            LAST="${LAST:-0.0.0}"
            CLEAN_VERSION="${LAST%.*}.$(( ${LAST##*.} + 1 ))~~dev$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER:-0}-1"
          fi

          echo "tag=${RAW_VERSION}" >> $GITHUB_OUTPUT
          echo "clean_version=${CLEAN_VERSION}" >> $GITHUB_OUTPUT
          echo "Resolved tag: ${RAW_VERSION} -> clean version: ${CLEAN_VERSION}"

  build-debs:
    name: Build Debian (${{ matrix.arch }})
    needs: version 
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install System Dependencies via rosdep
        run: |
          sudo apt-get update 
          sudo apt-get install -y libboost-thread-dev python3-serial ros-jazzy-ros2-control
          rosdep update
          rosdep install --from-paths . --ignore-src -r -y --rosdistro jazzy \
            --skip-keys "ubiquity_motor_ros2 ubiquity_motor_ros2_msgs"

      - name: Compile and Merge Install
        run: |
          source /opt/ros/jazzy/setup.bash
          mkdir -p /tmp/pkg-root/opt/ros/jazzy

          colcon build \
            --merge-install \
            --install-base /tmp/pkg-root/opt/ros/jazzy \
            --cmake-args -DCMAKE_BUILD_TYPE=Release 

      - name: Assemble Debian Package
        env:
          CLEAN_VERSION: ${{ needs.version.outputs.clean_version }}
          ARCH: ${{ matrix.arch }}
        run: |
          # 1. Clean colcon workspace scripts to avoid dpkg collisions
          rm -f /tmp/pkg-root/opt/ros/jazzy/setup.* \
                /tmp/pkg-root/opt/ros/jazzy/local_setup.* \
                /tmp/pkg-root/opt/ros/jazzy/_local_setup_util* \
                /tmp/pkg-root/opt/ros/jazzy/COLCON_IGNORE \
                /tmp/pkg-root/opt/ros/jazzy/.colcon_install_layout

          # 2. Stage Debian control directory and set standard permissions
          mkdir -p /tmp/pkg-root/DEBIAN
          find /tmp/pkg-root -type d -exec chmod 755 {} +

          # 3. Generate DEBIAN/control file
          cat << EOF | sed 's/^          //' > /tmp/pkg-root/DEBIAN/control
          Package: ros-jazzy-ubiquity-motor-ros2
          Version: ${CLEAN_VERSION}
          Section: misc
          Priority: optional
          Architecture: ${ARCH}
          Maintainer: Ubiquity Robotics <support@ubiquityrobotics.com>
          Depends: ros-jazzy-ros-base, ros-jazzy-rclcpp, ros-jazzy-rclcpp-lifecycle, ros-jazzy-hardware-interface, ros-jazzy-controller-manager, ros-jazzy-diff-drive-controller, ros-jazzy-pluginlib, ros-jazzy-diagnostic-updater, ros-jazzy-diagnostic-msgs, ros-jazzy-sensor-msgs, ros-jazzy-std-msgs, ros-jazzy-rosidl-default-runtime, libboost-thread-dev, python3-serial
          Homepage: https://github.com/UbiquityRobotics/ubiquity_motor_ros2
          Description: Ubiquity Robotics Motor Control Stack for Magni (MCB G5/G6)
           Provides ros2_control SystemInterface hardware plugin, high-speed serial packet
           protocol driver, odometry feedback, acceleration profiling, and firmware utility
           scripts for Ubiquity Robotics Magni mobile robots.
          EOF

          # 4. Build .deb package
          PKG_NAME="ros-jazzy-ubiquity-motor-ros2_${CLEAN_VERSION}_${ARCH}.deb"
          dpkg-deb --build --root-owner-group /tmp/pkg-root "${PKG_NAME}"
          sha256sum "${PKG_NAME}" > "${PKG_NAME}.sha256"

          echo "=== Package Metadata (${ARCH}) ==="
          dpkg-deb -I "${PKG_NAME}"
          echo "=== Executables & Shared Libraries (${ARCH}) ==="
          dpkg-deb -c "${PKG_NAME}" | grep -E "bin/|lib/" | head -n 35

      - name: Upload Package Artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: ros-jazzy-ubiquity-motor-ros2-${{ matrix.arch }}
          path: |
            ros-jazzy-ubiquity-motor-ros2_*.deb
            ros-jazzy-ubiquity-motor-ros2_*.deb.sha256
          retention-days: 14

  publish-release:
    name: Publish Release Assets to GitHub
    needs: [version, build-debs]
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '' && inputs.tag_name != 'latest')
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts (amd64)
        uses: actions/download-artifact@v4
        with:
          name: ros-jazzy-ubiquity-motor-ros2-amd64
          path: release-assets

      - name: Download Artifacts (arm64)
        uses: actions/download-artifact@v4
        with:
          name: ros-jazzy-ubiquity-motor-ros2-arm64
          path: release-assets

      - name: Verify Release Assets
        run: |
          echo "=== Ready to Publish Assets ==="
          ls -la release-assets/
          cat release-assets/*.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag == 'latest' && 'Ubiquity Motor ROS 2 Latest Rolling Release' || needs.version.outputs.tag }}
          prerelease: ${{ contains(needs.version.outputs.tag, 'beta') || needs.version.outputs.tag == 'latest' }}
          files: |
            release-assets/*
          generate_release_notes: true

  publish-apt:
    name: Publish to the apt repository (testing)
    needs: [version, build-debs]
    runs-on: ubuntu-latest
    steps:
      - name: Ask UbiquityRobotics/ubiquity_apt to publish this run's packages
        env:
          GH_TOKEN: ${{ secrets.APT_REPO_DISPATCH_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::notice::APT_REPO_DISPATCH_TOKEN is not set, so the packages are not published to apt"
            exit 0
          fi
          gh api repos/UbiquityRobotics/ubiquity_apt/dispatches \
            -f event_type=publish \
            -f "client_payload[repo]=${GITHUB_REPOSITORY}" \
            -f "client_payload[run_id]=${GITHUB_RUN_ID}" \
            -f "client_payload[distro]=jazzy"
          echo "Requested publish of run ${GITHUB_RUN_ID}: https://github.com/UbiquityRobotics/ubiquity_apt/actions/workflows/publish.yml" >> "${GITHUB_STEP_SUMMARY}"
